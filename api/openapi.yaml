  # ---------------------------------------------------------------- abastecimento
  /v1/vehicles/{vehicleId}/abastecimentos:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    get:
      operationId: listAbastecimentos
      tags: [abastecimento]
      summary: Abastecimentos
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Uma página do histórico, mais recente primeiro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AbastecimentoPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createAbastecimento
      tags: [abastecimento]
      summary: Registrar abastecimento
      description: |
        `volume_ml` e `total_cost_cents` são a fonte da verdade. `price_per_liter_cents`
        e `consumption` são derivados na leitura e nunca armazenados.

        A quilometragem gera uma leitura de odômetro com `source = abastecimento`. Envie
        `source: "correction"` para pular a checagem de vizinhos (RN-01) — a leitura
        gravada continua com `source = abastecimento`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAbastecimentoRequest" }
      responses:
        "200":
          description: O `id` enviado já existia neste veículo — retentativa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Abastecimento" }
        "201":
          description: Abastecimento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Abastecimento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Dados inválidos, combustível recusado, ou quilometragem inconsistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/abastecimentos/{abastecimentoId}:
    parameters:
      - name: abastecimentoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAbastecimento
      tags: [abastecimento]
      summary: Ver abastecimento
      description: O mesmo shape de um item da listagem, com `consumption` já calculado.
      responses:
        "200":
          description: O abastecimento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Abastecimento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAbastecimento
      tags: [abastecimento]
      summary: Atualizar abastecimento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAbastecimentoRequest" }
      responses:
        "200":
          description: Abastecimento atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Abastecimento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteAbastecimento
      tags: [abastecimento]
      summary: Apagar abastecimento
      description: A leitura de odômetro gerada some junto (CASCADE).
      responses:
        "204": { description: Abastecimento apagado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- telas
  /v1/vehicles/{vehicleId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    get:
      operationId: getDashboard
      tags: [telas]
      summary: A tela principal, em uma requisição
      parameters:
        - name: cost_months
          in: query
          description: Janela do resumo de custos, em meses.
          schema: { type: integer, format: int32, minimum: 1, maximum: 120, default: 12 }
      responses:
        "200":
          description: Veículo, odômetro, contagem de alertas e custos registrados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/vehicles/{vehicleId}/alerts:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    get:
      operationId: listAlerts
      tags: [telas]
      summary: Tudo que precisa de ação, de todos os domínios
      description: |
        Manutenção, cuidado recorrente, garantia, IPVA, licenciamento e seguro na mesma
        lista, ordenados por urgência.

        Só entram itens **vencidos** ou **vencendo em breve**. Um plano sem baseline não é
        alerta — é pedido de configuração, e o dashboard o conta separadamente em
        `alerts.needs_baseline`.

        `reference_type` e `reference_id` dizem para onde navegar ao tocar no alerta.
      responses:
        "200":
          description: Os alertas do veículo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Alert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/vehicles/{vehicleId}/timeline:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    get:
      operationId: getTimeline
      tags: [telas]
      summary: Histórico unificado do veículo
      description: |
        Manutenções, leituras manuais de quilometragem, abastecimentos e pagamentos de
        IPVA/licenciamento na mesma linha do tempo, mais recente primeiro.

        Leituras de odômetro geradas **por** uma manutenção ou um abastecimento não
        aparecem — apareceriam duas vezes.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Uma página da linha do tempo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelinePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de acesso obtido em `/v1/auth/login`, `/register` ou `/refresh`. Vale 15
        minutos; renove com o refresh token antes de expirar.

  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Tamanho da página. Valores fora da faixa são ajustados, não rejeitados.
      schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: |
        Cursor opaco devolvido em `next_cursor`. Repasse sem interpretar — o formato é
        interno e pode mudar.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Autenticação necessária, ou sessão inválida/expirada
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        Recurso não encontrado.

        Também é a resposta para um recurso que existe mas não pertence ao usuário: dizer
        "você não pode ver isto" confirmaria que ele existe.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflito com um recurso existente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: |
        Dados inválidos. `details.fields` traz **todos** os campos rejeitados de uma vez,
        com a chave igual à do JSON enviado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_failed
              message: Não foi possível criar a conta.
              details:
                fields:
                  email: Informe um e-mail válido.
                  password: A senha deve ter pelo menos 8 caracteres.
    RateLimited:
      description: Tentativas demais. Aguarde antes de tentar de novo.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamUnavailable:
      description: |
        Um serviço externo do qual esta rota depende não respondeu — hoje, só a fonte do
        catálogo de veículos.

        Nada está quebrado e nada foi feito de errado pelo usuário: vale tentar de novo em
        instantes. Não confunda com `rate_limited`, que diz que **este cliente** está indo
        rápido demais.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ------------------------------------------------------------ erro
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: Mensagem em pt-BR, exibível ao usuário.
            details:
              type: object
              additionalProperties: true
              description: |
                Dados estruturados específicos do erro. Em `validation_failed` traz
                `fields`; em `odometer_rollback`, o registro vizinho conflitante; em
                `internal`, o `request_id` para suporte.

    ErrorCode:
      type: string
      description: |
        Identificador estável do erro. **É nele que o cliente decide comportamento**, nunca
        na mensagem.

        Valores podem ser acrescentados no futuro — trate um código desconhecido como falha
        genérica, nunca como erro de parsing.
      enum:
        - validation_failed
        - unauthorized
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - odometer_rollback
        - rate_limited
        - upstream_unavailable
        - internal

    # ------------------------------------------------------------ enums de domínio
    VehicleType:
      type: string
      description: MVP-1 aceita apenas `car`.
      enum: [car]

    FuelType:
      type: string
      enum: [flex, gasolina, etanol, diesel, gnv, eletrico, hibrido]

    OdometerSource:
      type: string
      description: |
        Origem da leitura. O cliente só pode enviar `manual` ou `correction` — `maintenance`
        e `abastecimento` são escritos pelos próprios módulos, e aceitá-los aqui deixaria
        forjar uma leitura que se diz originada de um serviço.
      enum: [manual, correction, maintenance, abastecimento]

    MaintenanceItemKind:
      type: string
      description: |
        `maintenance` é histórico de serviço; `care` é hábito recorrente (calibrar pneus,
        lavar o carro). Ambos passam pelo mesmo motor de vencimento.
      enum: [maintenance, care]

    MaintenanceRecordKind:
      type: string
      description: |
        `performed` é um serviço que aconteceu e pode ser comprovado. `declared` é o dono
        afirmando de memória — o carro usado comprado com "última troca aos 95.000 km" e sem
        recibo.
      enum: [performed, declared]

    MaintenancePlanOrigin:
      type: string
      description: |
        De onde veio a informação do plano. Uma pergunta só — "quem disse isso?".

        `suggested` é o padrão genérico de mercado deste sistema; `user` é a decisão do
        dono, e qualquer edição promove para `user`. Os demais existem para quando a origem
        for melhor do que um padrão genérico; **nada os escreve hoje**, e um app antigo que
        não os conheça deve tratá-los como desconhecido, nunca quebrar.
      enum: [suggested, user, manufacturer, manual, admin, external_provider]

    MaintenanceStrategy:
      type: string
      description: |
        **Como** o item é mantido neste veículo. Antes existia só `periodic`, expresso como
        "o plano tem intervalo?" — o que não distinguia um componente sem troca programada
        de um cujo intervalo simplesmente não sabemos.

        - `periodic` — troca a cada X km ou Y meses.
        - `inspection` — verificar na revisão; pode não haver troca.
        - `condition_based` — troca por desgaste (pneu, pastilha, bateria). Um intervalo
          aqui é horizonte de "vale checar", nunca prazo — a interface deve escrever assim.
        - `no_schedule` — o componente existe e não tem regra periódica.
        - `not_applicable` — **o veículo não tem esse componente.** Não aparece em nenhuma
          tela que responda "o que meu carro precisa"; só na tela de configuração, que é
          onde dá para desfazer.
      enum: [periodic, inspection, condition_based, no_schedule, not_applicable]

    MaintenanceHistoryStatus:
      type: string
      description: |
        O que o dono disse sobre o passado deste item, quando não existe registro.

        `unknown` ("não sei") e `never` ("nunca foi feito") são respostas **diferentes** e o
        produto não pode juntá-las. Um registro real sempre prevalece sobre este campo — ele
        só carrega o que foi afirmado na ausência de um.
      enum: [not_asked, unknown, never]

    MaintenanceStatus:
      type: string
      description: |
        Estado de um plano. Calculado a cada leitura, nunca armazenado.

        - `vencido` — algum limite foi ultrapassado.
        - `vence_em_breve` — algum limite está dentro da antecedência configurada.
        - `em_dia` — nada perto.
        - `sem_baseline` — existe regra, mas nada foi registrado ainda. Não é alerta: é
          pedido de configuração.
        - `sem_periodicidade` — o plano agrupa histórico e nunca vence. Estado válido, não
          dado faltando.
        - `nao_se_aplica` — o veículo não tem esse componente. Nunca vence, nunca vira
          alerta, e só aparece quando a requisição pede `include_not_applicable=true`.
      enum: [vencido, vence_em_breve, em_dia, sem_baseline, sem_periodicidade, nao_se_aplica]

    ObligationKind:
      type: string
      enum: [ipva, licenciamento]

    ObligationStatus:
      type: string
      description: |
        `pago` prevalece sobre a data — IPVA pago em atraso está pago, não vencido. Vencendo
        **hoje** é `vence_em_breve`, não `vencido`: ainda há horas para pagar.
      enum: [pago, vencido, vence_em_breve, pendente]

    SeguroStatus:
      type: string
      description: |
        `futuro` é uma renovação já contratada que ainda não entrou em vigor. `vencido`
        significa que o carro está **sem cobertura**.
      enum: [futuro, vigente, vence_em_breve, vencido]

    AlertKind:
      type: string
      enum: [manutencao, cuidado, garantia, ipva, licenciamento, seguro]

    AlertSeverity:
      type: string
      description: Só dois valores — um alerta é algo que pede ação.
      enum: [vencido, vence_em_breve]

    TimelineEntryKind:
      type: string
      enum: [manutencao, odometro, ipva, licenciamento, abastecimento]

    # ------------------------------------------------------------ auth e conta
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            Mínimo 8 caracteres e nenhuma regra de composição, seguindo o NIST SP 800-63B —
            exigir símbolo e dígito produz "Senha1!" e nada mais seguro.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }

    UpdateMeRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }

    DeleteMeRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }

    User:
      type: object
      required: [id, name, email, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }

    Session:
      type: object
      required: [user, token_type, access_token, expires_at, refresh_token, refresh_expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        token_type: { type: string, enum: [Bearer] }
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
        refresh_token:
          type: string
          description: Guarde com segurança. É rotacionado a cada `/auth/refresh`.
        refresh_expires_at: { type: string, format: date-time }

    # ------------------------------------------------------------ veículo
    CreateVehicleRequest:
      type: object
      required: [brand, model]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: |
            UUIDv7 gerado pelo cliente. Torna a requisição idempotente: reenviar depois de
            uma queda de conexão devolve o mesmo veículo com `200` em vez de criar outro.
        vehicle_type: { $ref: "#/components/schemas/VehicleType" }
        brand: { type: string, maxLength: 120 }
        model: { type: string, maxLength: 120 }
        version: { type: string, nullable: true, maxLength: 120 }
        manufacture_year: { type: integer, format: int32, nullable: true }
        model_year:
          type: integer
          format: int32
          nullable: true
          description: Não pode ser anterior ao ano de fabricação. Teto é o ano atual + 1.
        plate:
          type: string
          nullable: true
          description: |
            Aceita os dois formatos em circulação — `ABC1234` e Mercosul `ABC1D23`.
            Separadores e caixa são normalizados; a resposta traz sempre em maiúsculas e sem
            hífen.
        renavam: { type: string, nullable: true, pattern: '^[0-9]{9,11}$' }
        chassis:
          type: string
          nullable: true
          description: 17 caracteres, sem as letras I, O e Q.
        fuel_type: { $ref: "#/components/schemas/FuelType" }
        color: { type: string, nullable: true, maxLength: 120 }
        nickname: { type: string, nullable: true, maxLength: 120 }
        catalog_model_year_id:
          type: string
          format: uuid
          nullable: true
          description: |
            O `id` de `GET /v1/vehicle-model-years/{modelYearId}`, quando o veículo foi
            escolhido pelo catálogo. **Opcional e assim permanece** — um veículo digitado à
            mão é um veículo de primeira classe.

            É o **único** id enviado: a marca e o modelo são derivados dele no servidor, de
            modo que não existe forma de vincular um modelo a uma marca que não é a dele.
            Um id que não existe devolve `404`.
        fipe_code:
          type: string
          nullable: true
          maxLength: 120
          description: |
            Cópia do código FIPE no momento do cadastro. Enviado pelo cliente, e é isso que
            o torna um registro do que o dono confirmou — os campos de texto do veículo são
            um retrato daquele instante, não uma consulta ao catálogo. Ver `Vehicle`.
        current_mileage_km:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: Quilometragem de abertura. Vira a primeira leitura de odômetro, datada de hoje.

    UpdateVehicleRequest:
      type: object
      description: |
        Campo ausente permanece como está. `null` num campo também significa "não altere"
        (o servidor usa COALESCE). Para voltar um opcional a `null`, nomeie-o em `clear`.
      properties:
        brand: { type: string, nullable: true, maxLength: 120 }
        model: { type: string, nullable: true, maxLength: 120 }
        version: { type: string, nullable: true, maxLength: 120 }
        manufacture_year: { type: integer, format: int32, nullable: true }
        model_year: { type: integer, format: int32, nullable: true }
        plate: { type: string, nullable: true }
        renavam: { type: string, nullable: true }
        chassis: { type: string, nullable: true }
        fuel_type: { $ref: "#/components/schemas/FuelType" }
        color: { type: string, nullable: true, maxLength: 120 }
        nickname: { type: string, nullable: true, maxLength: 120 }
        catalog_model_year_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Revincula o veículo a outra entrada do catálogo — "escolhi a versão errada".
            Ausente mantém o vínculo atual. Não há como desfazê-lo por `clear`: desvincular
            não é o mesmo que esvaziar um campo de retrato.
        fipe_code: { type: string, nullable: true, maxLength: 120 }
        clear:
          type: array
          items:
            type: string
            enum:
              - nickname
              - plate
              - color
              - renavam
              - chassis
              - version
              - fuel_type
              - fipe_code
              - manufacture_year
              - model_year
          description: |
            Campos opcionais a voltar para `null`. `brand` e `model` não entram — são
            NOT NULL. Um campo em `clear` e presente com valor no mesmo request é
            `validation_failed`. Valor desconhecido no array também, em `details.fields.clear`.

            Limpar `fuel_type` reconcilia os planos pelo mesmo caminho de uma troca de
            combustível. Se o powertrain ficar desconhecido, a RN-11 vale: desconhecido
            não apaga nada.

    Vehicle:
      type: object
      required:
        [id, vehicle_type, brand, model, current_mileage_km, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_type: { $ref: "#/components/schemas/VehicleType" }
        brand: { type: string }
        model: { type: string }
        version: { type: string, nullable: true }
        manufacture_year: { type: integer, format: int32, nullable: true }
        model_year: { type: integer, format: int32, nullable: true }
        plate: { type: string, nullable: true }
        renavam: { type: string, nullable: true }
        chassis: { type: string, nullable: true }
        fuel_type: { type: string, nullable: true }
        color: { type: string, nullable: true }
        nickname: { type: string, nullable: true }
        fipe_code: { type: string, nullable: true }

        # ---- vínculo com o catálogo ----
        #
        # Os campos de texto acima (brand, model, version, model_year, fuel_type,
        # fipe_code) são um RETRATO do que o dono confirmou no cadastro, não um espelho do
        # catálogo. A fonte externa reescreve as próprias descrições; um histórico de
        # serviço que se reescreve sozinho quando um fornecedor arruma um texto vale menos
        # na revenda do que um que não se reescreve.
        #
        # Os três ids abaixo respondem "de qual entrada do catálogo veio isto?". São
        # `null` quando o veículo foi digitado à mão, e continuam válidos como `null` para
        # sempre.
        catalog_brand_id: { type: string, format: uuid, nullable: true }
        catalog_model_id: { type: string, format: uuid, nullable: true }
        catalog_model_year_id: { type: string, format: uuid, nullable: true }

        current_mileage_km:
          type: integer
          format: int32
          description: |
            Derivado do histórico de odômetro — a leitura de data mais recente, não a de
            maior valor.
        current_mileage_at:
          type: string
          format: date
          nullable: true
          description: Data da leitura que produziu `current_mileage_km`.
        refueling:
          $ref: "#/components/schemas/RefuelingCapability"
          description: |
            O que este veículo aceita abastecer. Derivado de `fuel_type`, nunca armazenado.
            A API sempre envia. Um elétrico traz `supported: false` e `fuel_types: []`.
            `fuel_type` nulo ou desconhecido traz a lista permissiva — desconhecido não
            decide (RN-11).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ------------------------------------------------------------ catálogo de veículos
    #
    # O catálogo é uma cópia local de dados de terceiro, mantida no banco do Meu Auto e
    # preenchida sob demanda. Nada aqui expõe o fornecedor: não há `external_id`, não há
    # `provider`, não há `synced_at`. O app vê os ids do Meu Auto e o vocabulário do Meu
    # Auto — o que torna a troca de fornecedor uma decisão de backend, e não uma quebra de
    # contrato.

    VehicleBrand:
      type: object
      required: [id, vehicle_type, name]
      properties:
        id: { type: string, format: uuid }
        vehicle_type: { $ref: "#/components/schemas/VehicleType" }
        name: { type: string, description: "Como a fonte escreve — ex.: `VW - VolksWagen`." }

    VehicleModel:
      type: object
      required: [id, brand_id, name]
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        name:
          type: string
          description: |
            Modelo **e** versão num campo só — `PRIUS 1.8 16V 5p Aut. (Híbrido)`. A fonte
            não separa os dois.

    VehicleModelYear:
      type: object
      required: [id, model_id, name]
      properties:
        id: { type: string, format: uuid }
        model_id: { type: string, format: uuid }
        name: { type: string, description: "Ex.: `2017 Híbrido`." }
        year:
          type: integer
          format: int32
          nullable: true
          description: |
            `null` na entrada de veículo zero-quilômetro, que na fonte é uma faixa de preço
            e não um ano.
        fuel_label:
          type: string
          nullable: true
          description: A palavra da fonte, para exibir — `Híbrido`, `Diesel`, `Gasolina`.
        fuel_type:
          # Um `string` anulável em vez de $ref FuelType, pelo mesmo motivo que
          # `Vehicle.fuel_type` faz assim: em OpenAPI 3.0 um $ref não pode ser anulável, e
          # este campo é. Os valores possíveis são exatamente os de FuelType.
          type: string
          nullable: true
          enum: [flex, gasolina, etanol, diesel, gnv, eletrico, hibrido]
          description: |
            O **mesmo** combustível no vocabulário que `POST /v1/vehicles` aceita. Repasse
            direto: o app não precisa de tabela de tradução nenhuma.

            `null` quando a fonte usou uma palavra sem equivalente — aí o dono escolhe o
            combustível à mão, como já fazia.

    FipePrice:
      type: object
      required: [price_cents, reference_month, collected_at]
      properties:
        price_cents:
          type: integer
          format: int64
          description: Centavos, inteiro, como todo valor nesta API.
        reference_month:
          type: string
          format: date
          description: |
            Primeiro dia do mês a que a avaliação se refere. É um mês, não um dia — o dia 1
            é só o que o torna uma data que ordena e subtrai.
        collected_at:
          type: string
          format: date-time
          description: |
            Quando o Meu Auto coletou este valor, que não é o mesmo que o mês de referência.
            Está no contrato porque a avaliação **pode ser antiga**: com a fonte fora do ar,
            o último valor conhecido é servido em vez de nenhum.

    VehicleModelYearDetail:
      type: object
      required: [id, model_id, name, brand, model]
      properties:
        id: { type: string, format: uuid }
        model_id: { type: string, format: uuid }
        name: { type: string }
        year: { type: integer, format: int32, nullable: true }
        fuel_label: { type: string, nullable: true }
        fuel_type:
          type: string
          nullable: true
          enum: [flex, gasolina, etanol, diesel, gnv, eletrico, hibrido]
        fipe_code:
          type: string
          nullable: true
          description: |
            Código FIPE do veículo. `null` enquanto nenhuma avaliação tiver sido obtida — a
            fonte só o revela nesta rota, nunca nas listas.
        brand: { $ref: "#/components/schemas/VehicleBrand" }
        model: { $ref: "#/components/schemas/VehicleModel" }
        fipe_price:
          # type + allOf, not a bare nullable $ref: in OpenAPI 3.0 `nullable` needs a
          # sibling `type`, and the generator the app uses reads it the same way.
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FipePrice"
          description: |
            **`null` não é erro.** Quando a fonte externa não responde e nada foi guardado
            antes, o resto do objeto vem do banco e o cadastro segue normalmente. Uma
            avaliação vale ser mostrada; nunca vale travar um formulário.

    CreateOdometerReadingRequest:
      type: object
      required: [mileage_km]
      properties:
        id: { type: string, format: uuid, nullable: true }
        mileage_km: { type: integer, format: int32, minimum: 0 }
        occurred_on:
          type: string
          format: date
          nullable: true
          description: Padrão é hoje. Não pode estar no futuro.
        source:
          type: string
          enum: [manual, correction]
          description: |
            Padrão `manual`. Use `correction` para forçar uma leitura que o servidor
            rejeitou por inconsistência — painel trocado, ou valor anterior errado.
        notes: { type: string, nullable: true, maxLength: 500 }

    OdometerReading:
      type: object
      required: [id, vehicle_id, mileage_km, occurred_on, source, created_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        mileage_km: { type: integer, format: int32 }
        occurred_on: { type: string, format: date }
        source: { $ref: "#/components/schemas/OdometerSource" }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    CreateOdometerReadingResponse:
      type: object
      required: [reading, vehicle]
      properties:
        reading: { $ref: "#/components/schemas/OdometerReading" }
        vehicle:
          allOf:
            - $ref: "#/components/schemas/Vehicle"
          description: O veículo já com a quilometragem atualizada — evita uma segunda requisição.

    OdometerPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/OdometerReading" }
        next_cursor: { type: string, nullable: true }

    # ------------------------------------------------------------ manutenção
    CreateMaintenanceItemRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        kind: { $ref: "#/components/schemas/MaintenanceItemKind" }
        default_interval_km: { type: integer, format: int32, nullable: true, minimum: 1 }
        default_interval_months: { type: integer, format: int32, nullable: true, minimum: 1 }
        default_interval_days: { type: integer, format: int32, nullable: true, minimum: 1 }

    MaintenanceItem:
      type: object
      required: [id, slug, name, kind, vehicle_type, is_custom, default_strategy]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/MaintenanceItemKind" }
        vehicle_type: { type: string, enum: [car, motorcycle, all] }
        is_custom:
          type: boolean
          description: '`true` quando é um item criado por este usuário, não do catálogo global.'
        default_strategy:
          allOf: [{ $ref: "#/components/schemas/MaintenanceStrategy" }]
          description: |
            A estratégia do item como conceito. O plano de um veículo específico pode dizer
            outra coisa — inclusive que aquele veículo não tem o componente.

            O requisito de motorização do item **não** vai no contrato de propósito: a
            aplicabilidade é decidida no servidor, contra o veículo. Mandá-lo para o app
            seria convidar a uma segunda decisão que pode discordar da primeira.
        default_interval_km: { type: integer, format: int32, nullable: true }
        default_interval_months: { type: integer, format: int32, nullable: true }
        default_interval_days: { type: integer, format: int32, nullable: true }

    CreateMaintenancePlanRequest:
      type: object
      required: [maintenance_item_id]
      properties:
        id: { type: string, format: uuid, nullable: true }
        maintenance_item_id: { type: string, format: uuid }
        interval_km: { type: integer, format: int32, nullable: true, minimum: 1 }
        interval_months: { type: integer, format: int32, nullable: true, minimum: 1 }
        interval_days: { type: integer, format: int32, nullable: true, minimum: 1 }
        alert_km: { type: integer, format: int32, nullable: true, minimum: 0 }
        alert_days: { type: integer, format: int32, nullable: true, minimum: 0 }
        strategy:
          allOf: [{ $ref: "#/components/schemas/MaintenanceStrategy" }]
          description: Omitido, usa a estratégia padrão do item no catálogo.
        notes: { type: string, nullable: true, maxLength: 500 }

    UpdateMaintenancePlanRequest:
      type: object
      properties:
        interval_km: { type: integer, format: int32, nullable: true, minimum: 1 }
        interval_months: { type: integer, format: int32, nullable: true, minimum: 1 }
        interval_days: { type: integer, format: int32, nullable: true, minimum: 1 }
        alert_km: { type: integer, format: int32, nullable: true, minimum: 0 }
        alert_days: { type: integer, format: int32, nullable: true, minimum: 0 }
        strategy:
          allOf: [{ $ref: "#/components/schemas/MaintenanceStrategy" }]
          description: |
            Inclusive `not_applicable`, que é como o dono diz "meu carro não tem isso". Uma
            sugestão do sistema nunca bloqueia a correção — quem está olhando para o carro é
            ele.
        history_status:
          allOf: [{ $ref: "#/components/schemas/MaintenanceHistoryStatus" }]
          description: |
            Registra "não sei" ou "nunca foi feito" **sem inventar um registro**. Um registro
            `declared` afirma data e quilometragem, e quem não lembra não tem nenhuma das
            duas — gravá-lo mesmo assim colocaria um fato fabricado no histórico de serviço.
        notes: { type: string, nullable: true, maxLength: 500 }
        clear_intervals:
          type: boolean
          description: |
            Limpa os três intervalos, transformando o plano em um que só agrupa histórico e
            nunca vence. Precisa de flag própria porque `null` já significa "não altere".
            Não pode vir junto de um intervalo.
        clear_notes:
          type: boolean
          description: Limpa a observação. Mesma razão de `clear_intervals`.

    MaintenancePlanSummary:
      type: object
      description: O plano sem o estado calculado. Devolvido em criação e atualização.
      required: [id, maintenance_item_id, alert_km, alert_days, origin, strategy, history_status]
      properties:
        id: { type: string, format: uuid }
        maintenance_item_id: { type: string, format: uuid }
        interval_km: { type: integer, format: int32, nullable: true }
        interval_months: { type: integer, format: int32, nullable: true }
        interval_days: { type: integer, format: int32, nullable: true }
        alert_km: { type: integer, format: int32 }
        alert_days: { type: integer, format: int32 }
        origin: { $ref: "#/components/schemas/MaintenancePlanOrigin" }
        strategy: { $ref: "#/components/schemas/MaintenanceStrategy" }
        history_status: { $ref: "#/components/schemas/MaintenanceHistoryStatus" }
        notes: { type: string, nullable: true }

    MaintenancePlan:
      type: object
      description: O plano com o vencimento já calculado.
      required:
        [id, maintenance_item_id, item_slug, item_name, item_kind, alert_km, alert_days, origin,
         strategy, history_status, status]
      properties:
        id: { type: string, format: uuid }
        maintenance_item_id: { type: string, format: uuid }
        item_slug: { type: string }
        item_name: { type: string }
        item_kind: { $ref: "#/components/schemas/MaintenanceItemKind" }
        interval_km: { type: integer, format: int32, nullable: true }
        interval_months: { type: integer, format: int32, nullable: true }
        interval_days: { type: integer, format: int32, nullable: true }
        alert_km: { type: integer, format: int32 }
        alert_days: { type: integer, format: int32 }
        origin: { $ref: "#/components/schemas/MaintenancePlanOrigin" }
        strategy: { $ref: "#/components/schemas/MaintenanceStrategy" }
        history_status: { $ref: "#/components/schemas/MaintenanceHistoryStatus" }
        notes: { type: string, nullable: true }
        history_question:
          type: string
          nullable: true
          description: |
            A pergunta a fazer quando este item não tem baseline, vinda do catálogo. Está no
            contrato para o app montar o pedido de histórico a partir dos planos que já tem,
            em vez de carregar um mapa de slug técnico para pergunta em pt-BR — que foi
            exatamente como todo carro acabou sendo perguntado sobre correia dentada.
        history_priority:
          type: integer
          format: int32
          description: |
            Quais perguntas importam mais, maior primeiro. Ordenação de apresentação, mas
            pertence ao catálogo e não a uma lista de slugs dentro do app.
        status: { $ref: "#/components/schemas/MaintenanceStatus" }
        due_at_km:
          type: integer
          format: int32
          nullable: true
          description: '`null` quando o plano não tem intervalo por distância.'
        due_on:
          type: string
          format: date
          nullable: true
          description: '`null` quando o plano não tem intervalo por tempo.'
        remaining_km: { type: integer, format: int32, nullable: true }
        remaining_days: { type: integer, format: int32, nullable: true }
        last_occurred_on:
          type: string
          format: date
          nullable: true
          description: Data do último registro deste item. `null` quando `status` é `sem_baseline`.
        last_mileage_km: { type: integer, format: int32, nullable: true }

    MaintenanceProfileStatus:
      type: string
      description: |
        - `unknown` — nenhum plano. O app diz isso com todas as letras e oferece adicionar;
          não inventa um cronograma.
        - `incomplete` — existem planos e ainda há algo em aberto.
        - `ready` — nada a perguntar.
      enum: [unknown, incomplete, ready]

    MaintenanceProfile:
      type: object
      required:
        [status, powertrain_known, plan_count, not_applicable_count, missing_history_count,
         questions, answers]
      properties:
        status: { $ref: "#/components/schemas/MaintenanceProfileStatus" }
        powertrain_known:
          type: boolean
          description: |
            `false` quando o veículo não tem `fuel_type`. Tudo que depende de haver um motor
            fica sem resposta, e o app pede o combustível em vez de adivinhar os componentes.
        plan_count:
          type: integer
          description: Planos que o veículo tem, sem contar os `not_applicable`.
        not_applicable_count:
          type: integer
          description: Itens marcados como inexistentes neste veículo. É o número que a tela
            de configuração usa para oferecer desfazer.
        missing_history_count:
          type: integer
          description: |
            Planos cujo item nunca foi registrado **e** sobre os quais ninguém foi
            perguntado. Um "não sei" já respondido não entra nesta conta.
        questions:
          type: array
          items: { $ref: "#/components/schemas/MaintenanceProfileQuestion" }
        answers:
          type: object
          additionalProperties: { type: string }
          description: |
            O que já foi respondido, id da pergunta para valor da resposta — incluindo
            `unknown`, que é justamente por que a pergunta não está sendo feita de novo.
            Nunca `null`.

    MaintenanceProfileQuestion:
      type: object
      required: [id, prompt, help, options]
      properties:
        id:
          type: string
          description: |
            `timing_drive` é a única hoje. Correia dentada arrebentada leva o motor junto, e
            o modelo antigo perguntava de correia para todo carro — inclusive para os que têm
            corrente e para os que não têm motor a combustão nenhum.
        prompt: { type: string }
        help: { type: string }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }

    AnswerMaintenanceProfileRequest:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
          description: O `id` de uma pergunta devolvida pelo perfil.
        answer:
          type: string
          description: |
            Um dos `value` das opções daquela pergunta. Qualquer outro valor é `422` — o
            vocabulário vive no servidor e nada fora dele pode ampliá-lo.

    MaintenanceRecordItemRequest:
      type: object
      required: [maintenance_item_id]
      properties:
        maintenance_item_id: { type: string, format: uuid }
        description: { type: string, nullable: true }
        part_brand: { type: string, nullable: true }
        cost_cents: { type: integer, format: int64, nullable: true, minimum: 0 }
        warranty_months: { type: integer, format: int32, nullable: true, minimum: 1 }
        warranty_km: { type: integer, format: int32, nullable: true, minimum: 1 }

    CreateMaintenanceRecordRequest:
      type: object
      required: [items]
      properties:
        id: { type: string, format: uuid, nullable: true }
        occurred_on:
          type: string
          format: date
          nullable: true
          description: Padrão é hoje. Não pode estar no futuro.
        mileage_km:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Obrigatório se qualquer linha for `kind = maintenance`. Pode ser omitido
            quando **todas** as linhas são `kind = care` — calibrar pneu não produz
            quilometragem, e inventar uma a partir do cache viola RN-03.
        kind: { $ref: "#/components/schemas/MaintenanceRecordKind" }
        workshop_name: { type: string, nullable: true, maxLength: 120 }
        total_cost_cents: { type: integer, format: int64, nullable: true, minimum: 0 }
        notes: { type: string, nullable: true, maxLength: 500 }
        source:
          type: string
          enum: [manual, correction]
          description: |
            Instrução de validação, não a origem gravada na leitura de odômetro. Ausente
            equivale a `manual`. `correction` ignora a checagem de vizinhos (RN-01).
            `maintenance` e `abastecimento` são recusados — são escritos pelos módulos que
            os originam. A leitura gerada pelo registro continua com `source = maintenance`.
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            Pelo menos um item. O mesmo item não pode aparecer duas vezes no mesmo registro.
          items: { $ref: "#/components/schemas/MaintenanceRecordItemRequest" }

    UpdateMaintenanceRecordRequest:
      type: object
      description: Não altera as linhas de item.
      properties:
        occurred_on: { type: string, format: date, nullable: true }
        mileage_km: { type: integer, format: int32, nullable: true, minimum: 0 }
        workshop_name: { type: string, nullable: true }
        total_cost_cents: { type: integer, format: int64, nullable: true, minimum: 0 }
        notes: { type: string, nullable: true }
        source:
          type: string
          enum: [manual, correction]
          description: |
            Instrução de validação, não a origem gravada na leitura de odômetro. Ausente
            equivale a `manual`. `correction` ignora a checagem de vizinhos (RN-01).
            `maintenance` e `abastecimento` são recusados. A leitura deste registro
            continua com `source = maintenance`.

    MaintenanceRecordItem:
      type: object
      required: [id, maintenance_item_id, item_slug, item_name]
      properties:
        id: { type: string, format: uuid }
        maintenance_item_id: { type: string, format: uuid }
        item_slug: { type: string }
        item_name: { type: string }
        description: { type: string, nullable: true }
        part_brand: { type: string, nullable: true }
        cost_cents: { type: integer, format: int64, nullable: true }
        warranty_months: { type: integer, format: int32, nullable: true }
        warranty_km: { type: integer, format: int32, nullable: true }
        warranty_until:
          type: string
          format: date
          nullable: true
          description: |
            Derivado da data do registro mais os meses de garantia. Nunca armazenado — o
            servidor calcula a cada leitura.
        warranty_until_km:
          type: integer
          format: int32
          nullable: true
          description: Derivado da quilometragem do registro mais os quilômetros de garantia.

    MaintenanceRecord:
      type: object
      required:
        [id, vehicle_id, occurred_on, mileage_km, kind, total_cost_cents, items, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        occurred_on: { type: string, format: date }
        mileage_km:
          type: integer
          format: int32
          nullable: true
          description: |
            `null` num registro só de cuidados (`kind = care` em todas as linhas). Um app
            antigo que faça `json['mileage_km'] as int` lança nesse caso. A janela é
            segura enquanto só o app publicado grava registros — ele sempre manda km.
            O nulo só aparece depois que o cliente que omite km for publicado.
        kind: { $ref: "#/components/schemas/MaintenanceRecordKind" }
        workshop_name: { type: string, nullable: true }
        total_cost_cents: { type: integer, format: int64 }
        notes: { type: string, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/MaintenanceRecordItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MaintenanceRecordPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MaintenanceRecord" }
        next_cursor: { type: string, nullable: true }

    # ------------------------------------------------------------ abastecimento
    AbastecimentoFuel:
      type: string
      enum: [gasolina, etanol, diesel, gnv]
      description: |
        O combustível deste abastecimento, não o `fuel_type` do veículo. Um flex queima
        gasolina ou etanol; "flex" não é um valor válido aqui.

    ConsumptionStatus:
      type: string
      enum: [ok, insufficient_data, partial_fill, unavailable]

    Consumption:
      type: object
      required: [value, unit, status]
      properties:
        value:
          type: number
          nullable: true
          description: |
            km/L arredondado a duas casas no servidor. `null` sempre que `status` não é
            `ok`. O app formata para uma casa.
        unit:
          type: string
          enum: [km_per_liter]
          description: Sempre `km_per_liter`. String fixa, para uma unidade futura não ser uma quebra.
        status: { $ref: "#/components/schemas/ConsumptionStatus" }

    RefuelingCapability:
      type: object
      required: [supported, fuel_types]
      properties:
        supported: { type: boolean }
        fuel_types:
          type: array
          items: { $ref: "#/components/schemas/AbastecimentoFuel" }
          description: |
            Vazio quando `supported` é false. Recarga elétrica entra por esse gancho,
            sem refazer o objeto.

    Abastecimento:
      type: object
      required:
        [id, vehicle_id, occurred_on, mileage_km, volume_ml, total_cost_cents,
         price_per_liter_cents, fuel, full_tank, consumption, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        occurred_on: { type: string, format: date }
        mileage_km: { type: integer, format: int32, minimum: 0 }
        volume_ml:
          type: integer
          format: int32
          minimum: 1
          description: Litros × 1000. Fonte da verdade, junto com `total_cost_cents`.
        total_cost_cents: { type: integer, format: int64, minimum: 0 }
        price_per_liter_cents:
          type: integer
          format: int64
          description: |
            Derivado. `(total_cost_cents * 1000 + volume_ml/2) / volume_ml`, meio para cima.
            Nunca armazenado.
        fuel: { $ref: "#/components/schemas/AbastecimentoFuel" }
        full_tank: { type: boolean }
        station_name: { type: string, nullable: true, maxLength: 120 }
        notes: { type: string, nullable: true, maxLength: 500 }
        consumption: { $ref: "#/components/schemas/Consumption" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AbastecimentoPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Abastecimento" }
        next_cursor: { type: string, nullable: true }

    CreateAbastecimentoRequest:
      type: object
      required: [mileage_km, volume_ml, total_cost_cents, fuel]
      properties:
        id: { type: string, format: uuid, nullable: true }
        occurred_on:
          type: string
          format: date
          nullable: true
          description: Padrão é hoje. Não pode estar no futuro.
        mileage_km: { type: integer, format: int32, minimum: 0 }
        volume_ml: { type: integer, format: int32, minimum: 1 }
        total_cost_cents: { type: integer, format: int64, minimum: 0 }
        fuel: { $ref: "#/components/schemas/AbastecimentoFuel" }
        full_tank:
          type: boolean
          description: Padrão `true`.
        station_name: { type: string, nullable: true, maxLength: 120 }
        notes: { type: string, nullable: true, maxLength: 500 }
        source:
          type: string
          enum: [manual, correction]
          description: |
            Instrução de validação, não a origem gravada na leitura de odômetro. Ausente
            equivale a `manual`. `correction` ignora a checagem de vizinhos (RN-01).
            `abastecimento` e `maintenance` são recusados. A leitura gerada continua com
            `source = abastecimento`.

    UpdateAbastecimentoRequest:
      type: object
      properties:
        occurred_on: { type: string, format: date, nullable: true }
        mileage_km: { type: integer, format: int32, nullable: true, minimum: 0 }
        volume_ml: { type: integer, format: int32, nullable: true, minimum: 1 }
        total_cost_cents: { type: integer, format: int64, nullable: true, minimum: 0 }
        fuel: { $ref: "#/components/schemas/AbastecimentoFuel" }
        full_tank: { type: boolean }
        station_name: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        source:
          type: string
          enum: [manual, correction]
          description: |
            Instrução de validação, não a origem gravada na leitura de odômetro. Ausente
            equivale a `manual`. `correction` ignora a checagem de vizinhos (RN-01).
            A leitura deste abastecimento continua com `source = abastecimento`.

    # ------------------------------------------------------------ prazos
    CreateObligationRequest:
      type: object
      required: [kind, reference_year, due_on]
      properties:
        id: { type: string, format: uuid, nullable: true }
        kind: { $ref: "#/components/schemas/ObligationKind" }
        reference_year:
          type: integer
          format: int32
          description: Ano de referência do tributo. Teto é o ano atual + 1.
        due_on:
          type: string
          format: date
          description: Vencimento. **Pode** estar no futuro — normalmente está.
        amount_cents: { type: integer, format: int64, nullable: true, minimum: 0 }
        paid_on:
          type: string
          format: date
          nullable: true
          description: Data do pagamento. Não pode estar no futuro.
        paid_amount_cents: { type: integer, format: int64, nullable: true, minimum: 0 }
        notes: { type: string, nullable: true, maxLength: 500 }

    UpdateObligationRequest:
      type: object
      properties:
        due_on: { type: string, format: date, nullable: true }
        amount_cents: { type: integer, format: int64, nullable: true, minimum: 0 }
        paid_on: { type: string, format: date, nullable: true }
        paid_amount_cents: { type: integer, format: int64, nullable: true, minimum: 0 }
        notes: { type: string, nullable: true }
        clear_payment:
          type: boolean
          description: |
            Marca o débito como não pago, desfazendo um lançamento feito por engano. Precisa
            de flag própria porque `null` já significa "não altere". Não pode vir junto de
            dados de pagamento.

    Obligation:
      type: object
      required:
        [id, vehicle_id, kind, reference_year, due_on, status, remaining_days, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ObligationKind" }
        reference_year: { type: integer, format: int32 }
        due_on: { type: string, format: date }
        amount_cents: { type: integer, format: int64, nullable: true }
        paid_on: { type: string, format: date, nullable: true }
        paid_amount_cents: { type: integer, format: int64, nullable: true }
        notes: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ObligationStatus" }
        remaining_days:
          type: integer
          description: |
            Dias até o vencimento; negativo quando já passou. Devolvido mesmo quando pago,
            para a tela poder dizer "pago com 3 dias de atraso".
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateSeguroRequest:
      type: object
      required: [insurer_name, starts_on, ends_on]
      properties:
        id: { type: string, format: uuid, nullable: true }
        insurer_name: { type: string, maxLength: 120 }
        policy_number: { type: string, nullable: true, maxLength: 120 }
        starts_on: { type: string, format: date }
        ends_on:
          type: string
          format: date
          description: Não pode ser anterior a `starts_on`.
        premium_cents: { type: integer, format: int64, nullable: true, minimum: 0 }
        emergency_phone:
          type: string
          nullable: true
          maxLength: 32
          description: |
            O 0800 da seguradora. Só o tamanho é validado — formato de telefone brasileiro
            varia demais, e rejeitar um número que o dono consegue discar seria pior que
            guardar um estranho.
        broker_name: { type: string, nullable: true, maxLength: 120 }
        broker_phone: { type: string, nullable: true, maxLength: 32 }
        notes: { type: string, nullable: true, maxLength: 500 }

    UpdateSeguroRequest:
      type: object
      properties:
        insurer_name: { type: string, nullable: true, maxLength: 120 }
        policy_number: { type: string, nullable: true }
        starts_on: { type: string, format: date, nullable: true }
        ends_on: { type: string, format: date, nullable: true }
        premium_cents: { type: integer, format: int64, nullable: true, minimum: 0 }
        emergency_phone: { type: string, nullable: true }
        broker_name: { type: string, nullable: true }
        broker_phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    Seguro:
      type: object
      required:
        [id, vehicle_id, insurer_name, starts_on, ends_on, status, remaining_days, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        insurer_name: { type: string }
        policy_number: { type: string, nullable: true }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        premium_cents: { type: integer, format: int64, nullable: true }
        emergency_phone: { type: string, nullable: true }
        broker_name: { type: string, nullable: true }
        broker_phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/SeguroStatus" }
        remaining_days:
          type: integer
          description: |
            Dias até o fim da vigência; negativo quando já acabou. Para uma apólice `futuro`,
            conta até o **início**.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ------------------------------------------------------------ telas
    Alert:
      type: object
      required: [kind, severity, title, reference_type, reference_id]
      properties:
        kind: { $ref: "#/components/schemas/AlertKind" }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        due_on: { type: string, format: date, nullable: true }
        due_at_km: { type: integer, format: int32, nullable: true }
        remaining_days: { type: integer, format: int32, nullable: true }
        remaining_km: { type: integer, format: int32, nullable: true }
        reference_type:
          type: string
          enum: [maintenance_plan, maintenance_record, obligation, seguro]
          description: Para onde navegar ao tocar no alerta.
        reference_id: { type: string, format: uuid }

    Dashboard:
      type: object
      required: [vehicle, odometer, alerts, profile, costs]
      properties:
        vehicle:
          type: object
          required: [id, brand, model]
          properties:
            id: { type: string, format: uuid }
            brand: { type: string }
            model: { type: string }
            version: { type: string, nullable: true }
            nickname: { type: string, nullable: true }
            plate: { type: string, nullable: true }
        odometer:
          type: object
          required: [current_km]
          properties:
            current_km: { type: integer, format: int32 }
            recorded_on: { type: string, format: date, nullable: true }
        alerts:
          type: object
          required: [overdue, due_soon, needs_baseline, items]
          properties:
            overdue: { type: integer }
            due_soon: { type: integer }
            needs_baseline:
              type: integer
              description: |
                Planos cujo item nunca foi registrado, então não há de onde medir. É pedido
                de configuração, não prazo — por isso é contado aqui e **não** aparece em
                `items` nem em `/alerts`.
            items:
              type: array
              description: Apenas os mais urgentes. A lista completa está em `/alerts`.
              items: { $ref: "#/components/schemas/Alert" }
        profile:
          type: object
          required: [status, powertrain_known, open_questions]
          description: |
            O suficiente para a tela principal decidir se mostra **um** aviso discreto de
            "ainda falta saber algo sobre o seu carro" — nada além disso. As perguntas em si
            vivem em `GET /v1/vehicles/{id}/maintenance-profile`.
          properties:
            status: { $ref: "#/components/schemas/MaintenanceProfileStatus" }
            powertrain_known:
              type: boolean
              description: |
                `false` quando o veículo não tem combustível informado — a única lacuna que
                impede derivar qualquer coisa sobre o motor.
            open_questions: { type: integer }
        last_abastecimento:
          # type + allOf, not a bare nullable $ref: in OpenAPI 3.0 `nullable` needs a
          # sibling `type` (see fipe_price).
          type: object
          nullable: true
          description: |
            O abastecimento mais recente, com o consumo já derivado pelo módulo. Ausente
            ou `null` quando o veículo não tem nenhum. Não é alerta — um abastecimento não
            vence e não pede ação.
          allOf:
            - $ref: "#/components/schemas/DashboardLastAbastecimento"
        costs:
          type: object
          required:
            [period_months, since, maintenance_cents, obligations_cents, seguro_cents,
             tracked_cents, tracked_categories, abastecimento_cents, total_cents, categories]
          description: |
            `tracked_cents` e `tracked_categories` estão **congelados** no significado
            original (manutenção + IPVA/licenciamento + seguro), para um app já publicado
            continuar desenhando três barras que somam o total exibido. Combustível entra
            em `abastecimento_cents`, `total_cents` e `categories`. Remova os campos velhos
            quando a telemetria mostrar que nenhuma versão antiga do app está em uso.
          properties:
            period_months: { type: integer, format: int32 }
            since: { type: string, format: date }
            maintenance_cents: { type: integer, format: int64 }
            obligations_cents: { type: integer, format: int64 }
            seguro_cents: { type: integer, format: int64 }
            tracked_cents: { type: integer, format: int64 }
            tracked_categories:
              type: array
              items: { type: string }
            abastecimento_cents: { type: integer, format: int64 }
            total_cents:
              type: integer
              format: int64
              description: Soma de `categories[].cents`. O app novo lê este campo.
            categories:
              type: array
              items: { $ref: "#/components/schemas/CostCategory" }

    DashboardLastAbastecimento:
      type: object
      required: [id, occurred_on, total_cost_cents, volume_ml, price_per_liter_cents, fuel, consumption]
      properties:
        id: { type: string, format: uuid }
        occurred_on: { type: string, format: date }
        total_cost_cents: { type: integer, format: int64 }
        volume_ml: { type: integer, format: int32 }
        price_per_liter_cents: { type: integer, format: int64 }
        fuel: { $ref: "#/components/schemas/AbastecimentoFuel" }
        consumption: { $ref: "#/components/schemas/Consumption" }

    CostCategory:
      type: object
      required: [key, label, cents]
      properties:
        key: { type: string }
        label:
          type: string
          description: Rótulo pt-BR. Vem do servidor para uma categoria nova não exigir release do app.
        cents: { type: integer, format: int64 }

    TimelineEntry:
      type: object
      required: [kind, id, occurred_on]
      properties:
        kind: { $ref: "#/components/schemas/TimelineEntryKind" }
        id:
          type: string
          format: uuid
          description: Id do recurso de origem — a manutenção, a leitura ou o débito.
        occurred_on: { type: string, format: date }
        title:
          type: string
          nullable: true
          description: |
            Para uma manutenção, os itens do registro separados por vírgula. `null` nos
            demais tipos — a interface monta o rótulo a partir de `kind`.
        subtitle:
          type: string
          nullable: true
          description: |
            Oficina numa manutenção, origem numa leitura de odômetro, combustível num
            abastecimento, ano de referência num débito.
        amount_cents:
          type: integer
          format: int64
          nullable: true
          description: '`null` numa leitura de odômetro — não envolve dinheiro.'
        mileage_km:
          type: integer
          format: int32
          nullable: true
          description: |
            `null` num pagamento de tributo — não envolve quilometragem — e num registro
            de cuidado sem km.
        care:
          type: boolean
          nullable: true
          description: |
            `true` quando **todas** as linhas do registro são `kind = care`. `false` numa
            manutenção. `null` nos demais tipos da timeline. `kind` continua `manutencao`
            — um valor novo no enum faria um app publicado cair no fallback.

    TimelinePage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        next_cursor: { type: string, nullable: true }
